<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="The self-priming loop: an attacker-written affect tag moves the appraised mood, mood congruence then rewards that same memory, and 9 of 10 injections reach the top 5; zeroing the mood weight leaves 6."><style>text { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }.title { font-size: 14px; font-weight: 700; fill: #1C1917; }.body { font-size: 11.5px; fill: #1C1917; }.loop { font-size: 12px; font-weight: 700; fill: #7C2D12; }.pill { font-weight: 700; fill: #EA580C; }.caption { font-size: 11px; fill: #7C2D12; opacity: 0.9; }</style><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C2D12"/></marker><marker id="hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker></defs><rect width="880" height="330" rx="14" fill="#FFF7ED"/><rect width="880" height="330" rx="14" fill="none" stroke="#F59E0B" stroke-opacity="0.5"/><text x="440.0" y="34" text-anchor="middle" class="title">One injected memory, one turn: how the affect tag primes its own retrieval</text><rect x="9.0" y="58" width="158" height="92" rx="10" fill="white" stroke="#F59E0B" stroke-width="1.2"/><text x="21.0" y="84" class="title">1  write</text><text x="21.0" y="108" class="body">the attacker files one</text><text x="21.0" y="126" class="body">memory, with an affect tag</text><rect x="185.0" y="58" width="158" height="92" rx="10" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/><text x="197.0" y="84" class="title">2  appraise</text><text x="197.0" y="108" class="body">the turn reads it, and</text><text x="197.0" y="126" class="body">the mood follows the tag</text><line x1="169.0" y1="104.0" x2="182.0" y2="104.0" stroke="#7C2D12" stroke-width="1.6" marker-end="url(#head)"/><rect x="361.0" y="58" width="158" height="92" rx="10" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/><text x="373.0" y="84" class="title">3  score</text><text x="373.0" y="108" class="body">mood congruence rewards</text><text x="373.0" y="126" class="body">the memory that matches</text><line x1="345.0" y1="104.0" x2="358.0" y2="104.0" stroke="#7C2D12" stroke-width="1.6" marker-end="url(#head)"/><rect x="537.0" y="58" width="158" height="92" rx="10" fill="white" stroke="#F59E0B" stroke-width="1.2"/><text x="549.0" y="84" class="title">4  retrieve</text><text x="549.0" y="108" class="body">the plant makes the top 5</text><text x="549.0" y="126" class="body">on 9 of 10 attacks</text><line x1="521.0" y1="104.0" x2="534.0" y2="104.0" stroke="#7C2D12" stroke-width="1.6" marker-end="url(#head)"/><rect x="713.0" y="58" width="158" height="92" rx="10" fill="white" stroke="#F59E0B" stroke-width="1.2"/><text x="725.0" y="84" class="title">5  reply</text><text x="725.0" y="108" class="body">it enters the prompt;</text><text x="725.0" y="126" class="body">the model answers from it</text><line x1="697.0" y1="104.0" x2="710.0" y2="104.0" stroke="#7C2D12" stroke-width="1.6" marker-end="url(#head)"/><path d="M264.0,150 V196 H440.0 V154" fill="none" stroke="#EA580C" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#hot)"/><text x="352.0" y="214" text-anchor="middle" class="loop">the scorer reads the state the write just moved: cosine 0.90 to 0.99 on all 10 attacks</text><text x="440.0" y="278" text-anchor="middle" class="body">zero the mood-congruence weight and the loop has nothing to read: <tspan class="pill">9/10</tspan> poisoned becomes <tspan class="pill">6/10</tspan></text><text x="440.0" y="300" text-anchor="middle" class="caption">recomputed from the harness by assets/build_animations.py; python -m eval.attribution prints the same table</text></svg>