<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 548" width="680" height="548" role="img" aria-label="EMBR per-turn pipeline">
  <title>EMBR per-turn pipeline</title>
  <desc>On each player turn EMBR logs the event, updates the character's mood and trust, scores every memory with five weighted signals, builds the prompt from persona, state and top-k memories, then runs the local model to produce a reply. A memory store is written on step one and read on step three.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .lbl { font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif; }
    .title { font-weight: 600; }
  </style>
  <rect x="0" y="0" width="680" height="548" rx="14" fill="#ffffff"/>

  <!-- player input -->
  <rect x="180" y="20" width="180" height="40" rx="12" fill="#f5f5f4" stroke="#a8a29e"/>
  <text class="lbl title" x="270" y="45" font-size="14" text-anchor="middle" fill="#44403c">Player turn</text>
  <line x1="270" y1="60" x2="270" y2="130" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- container -->
  <rect x="60" y="84" width="420" height="350" rx="16" fill="#fafaf9" stroke="#d6d3d1"/>
  <text class="lbl title" x="80" y="108" font-size="14" fill="#9a3412">EMBR middleware</text>
  <text class="lbl" x="80" y="125" font-size="11" fill="#a8a29e">runs locally, no network</text>

  <!-- stages -->
  <g>
    <rect x="120" y="132" width="300" height="46" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text class="lbl title" x="135" y="153" font-size="14" fill="#9a3412">1 · Log event</text>
    <text class="lbl" x="135" y="170" font-size="11" fill="#b45309">event, affect tags, type</text>
  </g>
  <line x1="270" y1="178" x2="270" y2="190" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="120" y="190" width="300" height="46" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text class="lbl title" x="135" y="211" font-size="14" fill="#9a3412">2 · Update state</text>
    <text class="lbl" x="135" y="228" font-size="11" fill="#b45309">mood and trust</text>
  </g>
  <line x1="270" y1="236" x2="270" y2="248" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="120" y="248" width="300" height="46" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text class="lbl title" x="135" y="269" font-size="14" fill="#9a3412">3 · Score memories</text>
    <text class="lbl" x="135" y="286" font-size="11" fill="#b45309">five weighted signals</text>
  </g>
  <line x1="270" y1="294" x2="270" y2="306" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="120" y="306" width="300" height="46" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text class="lbl title" x="135" y="327" font-size="14" fill="#9a3412">4 · Build prompt</text>
    <text class="lbl" x="135" y="344" font-size="11" fill="#b45309">persona, state, top-k</text>
  </g>
  <line x1="270" y1="352" x2="270" y2="364" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="120" y="364" width="300" height="46" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text class="lbl title" x="135" y="385" font-size="14" fill="#9a3412">5 · Run model</text>
    <text class="lbl" x="135" y="402" font-size="11" fill="#b45309">Ouro 1.4B, 8 GB</text>
  </g>

  <!-- reply -->
  <line x1="270" y1="410" x2="270" y2="452" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="180" y="452" width="180" height="40" rx="12" fill="#f5f5f4" stroke="#a8a29e"/>
  <text class="lbl title" x="270" y="477" font-size="14" text-anchor="middle" fill="#44403c">Reply to game</text>

  <!-- memory store -->
  <rect x="510" y="208" width="120" height="72" rx="10" fill="#f5f5f4" stroke="#a8a29e"/>
  <text class="lbl title" x="570" y="237" font-size="14" text-anchor="middle" fill="#44403c">Memory store</text>
  <text class="lbl" x="570" y="254" font-size="11" text-anchor="middle" fill="#78716c">SQLite + vectors</text>
  <line x1="420" y1="155" x2="510" y2="224" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="lbl" x="452" y="178" font-size="11" fill="#78716c">write</text>
  <line x1="510" y1="262" x2="420" y2="271" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="lbl" x="452" y="295" font-size="11" fill="#78716c">read</text>

  <!-- loop back -->
  <path d="M180,472 L40,472 Q28,472 28,460 L28,52 Q28,40 40,40 L180,40" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text class="lbl" x="96" y="466" font-size="11" fill="#78716c">next turn</text>

  <!-- legend -->
  <rect x="180" y="508" width="12" height="12" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text class="lbl" x="198" y="518" font-size="11" fill="#78716c">EMBR processing stage</text>
  <rect x="370" y="508" width="12" height="12" rx="3" fill="#f5f5f4" stroke="#a8a29e"/>
  <text class="lbl" x="388" y="518" font-size="11" fill="#78716c">game I/O · memory store</text>
</svg>
