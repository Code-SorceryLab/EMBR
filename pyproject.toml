[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embr"
version = "0.2.0"
description = "Emotional Memory for Believable Roleplay: emotion-grounded memory for persistent game NPCs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AL Shifan", email = "codeandsorcerylab@gmail.com" }]
keywords = ["LLM", "NPC", "memory", "affective-computing", "retrieval", "game-ai"]

# The core needs nothing: the applet, the NPC server, and the whole evaluation run on the
# standard library. The heavy stacks are extras, so a fresh clone runs everything but the
# real models and the paper figures with nothing installed.
dependencies = []

[project.optional-dependencies]
# Real semantic embeddings and the thesis model (Ouro 1.4B) in-process. BM25 is in-tree, so
# the evaluation never needs this; installing it swaps the deterministic embedder and the
# echo stub for the real thing.
ml = [
    "sentence-transformers>=2.2",
    "torch>=2.2",
    # Both bounds are load-bearing for Ouro's remote code (snapshot 574fa66 and later).
    # Below 4.56 its cache init crashes; on 5.x OuroConfig has no pad_token_id and the
    # rope-config lookup raises. Verified working on 4.57.
    "transformers>=4.56,<5",
    "accelerate>=0.30",
]
# Paper figures. Only the asset build step needs a plotting library.
figures = [
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
]

[project.scripts]
embr = "embr.cli:run_menu"

[project.urls]
Repository = "https://github.com/Code-SorceryLab/EMBR"

[tool.hatch.build.targets.wheel]
# Three packages, one src tree: the library (with the applet), the harness (with the paper
# asset builders), and the web demo.
packages = ["src/embr", "src/eval", "src/web"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "assets", "docs", "menu.py", "conftest.py", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
