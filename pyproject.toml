[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embr"
version = "0.1.0"
description = "Emotional Memory for Believable Roleplay: emotion-grounded memory for persistent game NPCs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AL Shifan", email = "codeandsorcerylab@gmail.com" }]
keywords = ["LLM", "NPC", "memory", "affective-computing", "retrieval", "game-ai"]

# Core stays tiny on purpose: the menu and the eval harness both run on this alone. The
# heavy ML stack goes in the optional extras below, so a fresh clone runs the skeleton,
# the demo turn, and the full evaluation with almost nothing installed.
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
# Real semantic embeddings and the real local model (Ouro 1.4B, the thesis model). BM25 is
# implemented in-tree, so nothing here is needed to run the eval; installing it swaps the
# deterministic embedder and the echo stub for the real thing.
ml = [
    "sentence-transformers>=2.2",
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.30",
]
# Paper figures. Kept out of the core so the harness stays dependency-light; only the
# asset build step needs a plotting library.
figures = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
embr = "embr.menu:run_menu"

[tool.setuptools.packages.find]
include = ["embr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
